services:
  - type: web
    name: shivam-attendance-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: SUPER_ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: SUPER_ADMIN_PHONE
        value: "+919999999999"
      - key: SUPER_ADMIN_NAME
        value: "Super Admin"
      - key: OFFICE_LATITUDE
        value: "18.1361880"
      - key: OFFICE_LONGITUDE
        value: "74.5104810"
      - key: ATTENDANCE_GEOFENCE_RADIUS_METERS
        value: "100"
      - key: TIMEZONE
        value: "Asia/Kolkata"
